name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The platforms ofpack is released for. Windows is not tested because it
    # is not supported: the archive format relies on unix symlinks and file
    # modes.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

  # The version has to be the same in the three places that report it, and
  # the one in the bundled binary is the one that is easy to get wrong: it
  # comes from source ofpack compiles itself, not from this build.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build and compare
        run: |
          go build -o ofpack .
          constant=$(go run ./.github/scripts/printversion)
          binary=$(./ofpack version | awk '{print $2}')
          manifest=$(grep -o '"[0-9][^"]*"' .release-please-manifest.json | tr -d '"')
          echo "constant=$constant binary=$binary manifest=$manifest"
          for got in "$binary" "$manifest"; do
            if [ "$got" != "$constant" ]; then
              echo "::error::version mismatch: constant $constant, got $got"
              exit 1
            fi
          done
